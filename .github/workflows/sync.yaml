# Keep the fork alive: mirror upstream master, rebase the `ankor` patch series onto it,
# test, push, and release. A conflict or red tests opens/updates an `upstream-sync` issue.
name: Upstream sync

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      force_release:
        description: Run the full path (rebase, test, push, release) even if upstream is unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Rebase onto upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      release: ${{ steps.sync.outputs.release }}
    steps:
      # Pushes go through a write deploy key: GITHUB_TOKEN may not push commits that
      # touch .github/workflows, and a rebase rewrites the fork's CI commit.
      - uses: actions/checkout@v4
        with:
          ref: ankor
          fetch-depth: 0
          ssh-key: ${{ secrets.FORK_DEPLOY_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          lein: latest

      - name: Sync
        id: sync
        env:
          FORCE_RELEASE: ${{ inputs.force_release || false }}
        run: bash .github/scripts/sync-upstream.sh

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.sync.outputs.failure_reason }}
        run: bash .github/scripts/report-sync-failure.sh

  release:
    needs: sync
    if: needs.sync.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yaml
    secrets:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}

  # GitHub disables scheduled workflows after 60 days without repository activity; a
  # dormant upstream means no activity here. Re-enabling resets that counter.
  keepalive:
    name: Keep schedule alive
    if: always()
    needs: [sync, release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable sync.yaml --repo "$GITHUB_REPOSITORY"
